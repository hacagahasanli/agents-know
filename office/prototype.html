<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agents-know / the office (prototype v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d4;--panel:#f8f1e3;--panel2:#efe5d1;--ink:#2a2733;--muted:#7d7566;--line:#dccfb6;
  --accent:#d4552f;--good:#2f8f5b;--bad:#cf3b3b;--warn:#c98a1b;--info:#4a6fa5;
  --serif:Fraunces,Georgia,"Times New Roman",serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#16151d;--panel:#1f1d29;--panel2:#292636;--ink:#f1ebdf;--muted:#a39db1;--line:#3a3650;
  --accent:#ff7a4f;--good:#4cc283;--bad:#ff6464;--warn:#e8ac3a;--info:#7ea6e0;}}
:root[data-theme=dark]{
  --bg:#16151d;--panel:#1f1d29;--panel2:#292636;--ink:#f1ebdf;--muted:#a39db1;--line:#3a3650;
  --accent:#ff7a4f;--good:#4cc283;--bad:#ff6464;--warn:#e8ac3a;--info:#7ea6e0;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:1fr 340px;height:100vh;min-height:520px}
.stage{position:relative;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;z-index:3;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:11px;line-height:1.4;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}.tip b{font-family:var(--serif);font-size:14px}.tip i{color:var(--muted);font-style:normal}
.banner{position:absolute;left:50%;top:18px;transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;z-index:4;
  display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:var(--good);color:#fff;
  font:800 20px/1 var(--serif);letter-spacing:.01em;box-shadow:0 10px 30px rgba(47,143,91,.45);transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
.banner svg{width:22px;height:22px}
.controls{position:absolute;left:14px;right:14px;bottom:12px;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:14px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(6px)}
.btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none}
.btn:hover{border-color:var(--accent)}.btn:focus-visible,.seg button:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:16px;height:16px;fill:currentColor}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:0 10px;height:32px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.track{position:relative;flex:1;height:34px;min-width:60px;display:flex;align-items:center}
#scrub{width:100%;margin:0;accent-color:var(--accent);position:relative;z-index:2;background:transparent}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:0;z-index:1;pointer-events:none}
.ticks i{position:absolute;top:-13px;width:3px;height:9px;border-radius:2px;background:var(--warn);opacity:.9}
.ticks i.r{background:var(--bad);top:-16px;height:13px;width:4px}
.clock{flex:none;color:var(--muted);font-size:11px;min-width:64px;text-align:right}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.side header{padding:18px 18px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{margin:0;font:800 26px/1 var(--serif);letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:11px}
.badge{flex:none;padding:5px 9px;border-radius:6px;border:1.5px solid var(--bad);color:var(--bad);font-weight:600;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;transform:rotate(3deg)}
.run{margin:0 18px 12px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:12px;line-height:1.4}
.run b{font-family:var(--serif);font-size:15px;display:block}
.phases{list-style:none;margin:0 18px 12px;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.phases li{--h:200;text-align:center;padding:6px 0 5px;border-radius:8px;font-size:10px;color:var(--muted);border:1px solid var(--line);position:relative;transition:all .25s}
.phases li.seen{color:var(--ink);border-color:hsl(var(--h) 45% 55%)}
.phases li.now{background:hsl(var(--h) 55% 52%);border-color:transparent;color:#fff;font-weight:600;transform:translateY(-2px);box-shadow:0 4px 12px hsl(var(--h) 55% 40% / .4)}
.stats{margin:0 18px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{padding:8px 6px 7px;border-radius:10px;background:var(--panel2);text-align:center}
.stat b{display:block;font:800 24px/1 var(--serif)}.stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.pop b{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.stat.r b{color:var(--bad)}.stat.f b{color:var(--warn)}.stat.p b{color:var(--good)}.stat.h b{color:var(--accent)}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.feedhead{margin:0 18px 6px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.feed{flex:1;min-height:0;overflow:auto;margin:0 8px 10px;padding:0 6px;scroll-behavior:smooth}
.row{display:grid;grid-template-columns:54px 1fr;gap:0 8px;padding:5px 8px;border-radius:8px;font-size:11px;line-height:1.45;cursor:pointer;border-left:3px solid transparent;animation:in .3s ease-out}
.row[hidden]{display:none}
.row:hover{background:var(--panel2)}
.row time{color:var(--muted);grid-row:1/3}
.row b{--h:200;color:hsl(var(--h) 55% 42%);font-weight:600}
:root[data-theme=dark] .row b{color:hsl(var(--h) 65% 70%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .row b{color:hsl(var(--h) 65% 70%)}}
.row span{color:var(--ink);overflow-wrap:anywhere}
.row.k-handback{border-left-color:var(--accent)}.row.k-finding{border-left-color:var(--warn)}
.row.k-reject{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}.row.k-reject span{color:var(--bad);font-weight:600}
.row.k-pass{border-left-color:var(--good)}.row.k-done{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);font-weight:600}
.row.now{background:var(--panel2)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto}.side{min-width:0}
  .stage{aspect-ratio:1430/800;min-height:240px}
  .controls{position:absolute;left:6px;right:6px;bottom:6px;gap:6px;padding:5px 6px}
  .seg button{padding:0 7px}.clock{display:none}.btn{width:30px;height:30px}
  .side{border-left:0;border-top:1px solid var(--line)}.feed{max-height:300px;flex:none}
  .controls .btn.restart{display:none}
  .banner{font-size:13px;padding:8px 14px;top:8px}
}
</style>
</head>
<body>
<div class="app">

    <div class="banner" id="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>Definition of done: met</div>

      </div>

      <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="100" step="0.05" value="0" aria-label="Scrub the run"></div>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </main>
  <aside class="side">
    <header>
      <div><h1>The office</h1><p class="sub">agents-know / demo run, no real data</p></div>
      <span class="badge" id="badge">hardcore</span>
    </header>
    <p class="run"><b>Comments with @mentions</b>feature run, zero tolerance, bar-raiser on every hand-back</p>
    <ol class="phases" id="phases" aria-label="Phase"></ol>
    <div class="stats">
      <div class="stat h" id="s-h"><b>0</b><span>hand-backs</span></div>
      <div class="stat r" id="s-r"><b>0</b><span>rejects</span></div>
      <div class="stat f" id="s-f"><b>0</b><span>findings</span></div>
      <div class="stat p" id="s-p"><b>0</b><span>passes</span></div>
    </div>
    <div class="feedhead"><span>feed.md</span><span id="count">0 / 0</span></div>
    <div class="feed" id="feed" tabindex="0" aria-label="Live feed"></div>
  </aside>
</div>
<script>
(()=>{
'use strict';

const fmt=s=>{const t=17*3600+20*60+s;return `${pad(t/3600|0)}:${pad(t%3600/60|0)}:${pad(t%60)}`};
const SCRIPT=[
[0,'pm','Started: run "Comments with @mentions" (feature)'],

[124,'security-engineer','[pass:backend-engineer] Pass: re-attacked, IDOR closed, payloads escaped'],
[126,'staff-reviewer','Started: reviewing the whole change set'],

[132,'ip-guard','Pass: nothing identifies a reference product'],
[134,'staff-reviewer','Pass: simple, fits the conventions'],
[136,'bar-raiser','[pass:staff-reviewer] Pass: final change set meets the bar'],
[138,'tech-writer','Handback: review guide and user docs ready'],
[140,'mentor','Wrote: lesson on why mentions are stored as tokens'],
[146,'pm','Done: Definition of done met. 4 slices, 2 rejects, 6 findings']
];
const FEED=SCRIPT.slice().sort((a,b)=>a[0]-b[0]).map(([s,a,b])=>`${fmt(s)}  ${a}  ${b}`).join('\n');
const MONO='"JetBrains Mono",ui-monospace,Menlo,monospace',SERIF='Fraunces,Georgia,serif';
const ZONES=[{id:'Plan',hue:162},{id:'Build',hue:42},{id:'Verify',hue:212},{id:'Review',hue:345},{id:'Ship',hue:92},{id:'Learn',hue:285}];
const ZID=Object.fromEntries(ZONES.map(z=>[z.id,z]));
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const AGENTS=[
 ['cartographer','Plan','Keeps a compact repo map so nobody explores blind'],
 ['dispatcher','Plan','Picks the smallest team and cheapest model'],
 ['researcher','Plan','Reverse-engineers reference products'],
 ['analyst','Plan','Turns the matrix into a PRD'],
 ['architect','Plan','Data model, contracts, ADRs, slices'],
 ['product-designer','Plan','Flows, states, motion'],
 ['frontend-engineer','Build','UI slices with tests and a11y'],
 ['backend-engineer','Build','Models, migrations, endpoints'],
 ['migration-engineer','Build','Importers and mapping'],
 ['debugger','Build','Failing test first, then root cause'],
 ['test-data-engineer','Build','Anonymised production-shaped data'],
 ['skeptic','Verify','Re-runs everything, tries to disprove "done"'],
 ['qa-engineer','Verify','Test strategy and side-by-side checks'],
 ['security-engineer','Verify','Attacks the team\'s own work'],
 ['accessibility-specialist','Verify','WCAG 2.2 AA audit'],
 ['performance-engineer','Verify','Bundle, load and query cost'],
 ['sre-engineer','Verify','SLOs, runbooks, safe rollout'],
 ['bar-raiser','Review','Scores every hand-back. Rejects until excellent'],
 ['staff-reviewer','Review','Whole change set, creativity bar'],
 ['ip-guard','Review','Nothing copied from a reference product'],
 ['tech-writer','Ship','Review guide, user docs, recaps'],
 ['incident-commander','Ship','Runs production incidents'],
 ['mentor','Learn','Teaches what was built and why'],
 ['upgrader','Learn','Dependency and framework upgrades']
].map(([id,zone,role],n)=>({id,zone,role,seed:hash(id)%1000,n}));
const AID=Object.fromEntries(AGENTS.map(a=>[a.id,a]));
AID.pm={id:'pm',zone:null,role:'The PM: loads specialists, collects hand-backs, owns the ledger',seed:7};
const NAMES=AGENTS.map(a=>a.id).sort((a,b)=>b.length-a.length);
const SKIN=[28,24,20,32,18],HAIR=[25,35,45,10,48,280];

function parse(text){
 const out=[];let lastHb=null;
 const sec=t=>{const [h,m,s]=t.split(':').map(Number);return h*3600+m*60+s};
 for(const line of text.split('\n')){
  const m=line.match(/^(\d\d:\d\d:\d\d)\s+(\S+)\s+(.*\S)\s*$/);if(!m)continue;
  const [,time,agent]=m;let body=m[3],tag=null,tgt=null;
  const tm=body.match(/^\[(\w+)(?::([\w-]+))?\]\s*/);
  if(tm){tag=tm[1].toLowerCase();tgt=tm[2]||null;body=body.slice(tm[0].length)}
  let kind=tag;
  if(!kind){
   if(/^rejected\b/i.test(body)||(agent==='bar-raiser'&&/\brejected\.?$/i.test(body)))kind='reject';
   else if(/^started\b/i.test(body))kind='start';
   else if(/^hand-?back\b/i.test(body))kind='handback';
   else if(/^(wrote|created|updated|fixed)\b/i.test(body))kind='wrote';
   else if(/^(finding|found)\b/i.test(body))kind='finding';
   else if(/^(pass|passed|approved|verified)\b/i.test(body))kind='pass';
   else if(/definition of done|^done\b/i.test(body))kind='done';
   else if(/^team:/i.test(body))kind='team';
   else kind='info';
  }
  const e={i:out.length,time,s:sec(time),agent,body,kind,target:null,alarm:false,team:null};
  const named=NAMES.find(n=>n!==agent&&new RegExp('(^|[^\\w-])'+n+'([^\\w-]|$)').test(body));
  if(kind==='reject')e.target=tgt||named||lastHb;
  if(kind==='finding'&&agent==='skeptic'&&/disprov/i.test(body)){e.alarm=true;e.target=tgt||named||lastHb}
  if(kind==='pass')e.target=(agent==='skeptic'||agent==='bar-raiser')?(tgt||lastHb):agent;
  if(kind==='handback')lastHb=agent;
  if(/^team:/i.test(body))e.team=body.slice(5).split(',').map(x=>x.trim());
  e.zone=(AID[agent]&&AID[agent].zone)||null;
  if(agent==='bar-raiser'||agent==='skeptic')e.zone=null;
  out.push(e);
 }
 return out;
}
const E=parse(FEED),N=E.length;
const T=E.map(e=>1.2+(e.s-E[0].s));
const TEND=T[N-1]+3;

const W=28,D=14.6,C0=6.4,C1=8.4,CY=7.4,SPEED=3.6;
const RM={};
function room(id,name,x0,x1,top,hue,doorX,cols,zone){RM[id]={id,name,x0,x1,top,y0:top?0:C1,y1:top?C0:D,hue,doorX,cols,zone,laneY:top?5.65:9.0,wallY:top?C0:C1}}
room('pm','PM office',0,5.2,true,32,4.1,0,null);
room('plan','Plan room',5.2,12.8,true,162,6.4,3,'Plan');
room('build','Build room',12.8,20.4,true,42,14.0,3,'Build');
room('verify','Verify room',20.4,28,true,212,21.6,3,'Verify');
room('review','Review room',0,5.8,false,345,1.2,2,'Review');
room('ship','Ship room',5.8,10.3,false,92,7.0,1,'Ship');
room('learn','Learn room',10.3,14.8,false,285,11.5,1,'Learn');
room('server','Server room',14.8,20.4,false,215,19.2,0,null);
room('rest','Rest room',20.4,28,false,14,21.6,0,null);RM.rest.laneY=9.9;
const desks=[];
function mkDesk(a,r,x,y,w=1.7,d=1.0,chx=1.2){
 const chair={x:x+chx,y:y-.7},gx=x+w+.35;
 return {a,r,x,y,w,d,chair,gx,cx:x+w/2,cy:y+d/2,
  seat:{room:r.id,pts:[[gx,r.laneY],[gx,chair.y],[chair.x,chair.y]]},
  visit:{room:r.id,pts:[[gx,r.laneY],[gx,y+d+.28],[x+.55,y+d+.28]]}};
}
Object.values(RM).forEach(r=>{
 if(!r.zone)return;
 AGENTS.filter(a=>a.zone===r.zone).forEach((a,i)=>{
  const col=i%r.cols,row=Math.floor(i/r.cols);
  desks.push(mkDesk(a,r,r.x0+.5+col*2.4,(r.top?1.4:10.3)+row*2.45));
 });
});

document.getElementById('restart').addEventListener('click',()=>restart());
function restart(){seek(0);scrub.value=0;playing=true;ui()}
document.querySelectorAll('.seg button').forEach(b=>{
 b.setAttribute('aria-pressed',+b.dataset.s===speed);
 b.addEventListener('click',()=>{speed=+b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))})});
addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'&&e.key!==' ')return;
 if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();playBtn.click()}
 if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')seek(T[Math.min(N-1,st.idx)]+.01);
 if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')seek(st.idx>1?T[st.idx-2]+.01:0);
});
cv.addEventListener('pointermove',e=>{
 const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
 for(const id in S){const[x,y]=anchor(id);const sx=x*K+OX,sy=(y+8)*K+OY;const d=Math.hypot(sx-mx,(sy-my)*.8);if(d<bd){bd=d;best=id}}
 hover=bd<40*K+10?best:null;
 if(hover){const ag=AID[hover],A=S[hover];
  tip.innerHTML=`<b>${ag.id}</b><br>${ag.role}<br><i>${A.awake?(A.bubble?A.bubble.text:'seated'):'dormant, not loaded for this run'}</i>`;
  tip.style.left=clamp(mx+14,6,cw-270)+'px';tip.style.top=clamp(my+14,6,ch-90)+'px';tip.classList.add('on')}
 else tip.classList.remove('on');
});
cv.addEventListener('pointerleave',()=>{hover=null;tip.classList.remove('on')});
addWalls();addDecor();
desks.forEach(d=>add(d.cx+d.cy,()=>drawDesk(d)));
add(PMD.cx+PMD.cy+.3,drawPM);
DOORS.forEach(d=>add(d.x+d.y+.02,()=>drawDoor(d)));
ITEMS.sort((a,b)=>a.k-b.k);
new ResizeObserver(layout).observe(stage);layout();
const t0=+q.get('t');if(t0>0)seek(t0);
ui();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
