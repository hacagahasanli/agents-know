name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard hook tests
        run: bash tests/guard.test.sh
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/*.json hooks/hooks.json .mcp.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
      - name: Agent and skill frontmatter
        run: |
          fail=0
          for f in agents/*.md skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; fail=1; }
            grep -q '^name:' "$f" || { echo "missing name: $f"; fail=1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; fail=1; }
          done
          exit $fail
      - name: Shell syntax
        run: for f in hooks/*.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done
